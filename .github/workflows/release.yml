name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build, for example v0.3.17'
        required: true
        type: string
      checkout_ref:
        description: 'Git ref to build from. Defaults to release_tag. If provided, must equal release_tag.'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.checkout_ref || inputs.release_tag) || github.ref_name }}

jobs:
  # 1. 先创建 GitHub Release（带更新日志）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      # 安全校验：手动触发时 checkout_ref 必须与 release_tag 一致，
      # 防止 Release 产物与 tag 对应的源码不一致（供应链一致性）。
      - name: Validate checkout_ref matches release_tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          if [ -n "$INPUT_CHECKOUT_REF" ] && [ "$INPUT_CHECKOUT_REF" != "$INPUT_RELEASE_TAG" ]; then
            echo "::error::checkout_ref ('$INPUT_CHECKOUT_REF') 与 release_tag ('$INPUT_RELEASE_TAG') 不一致，构建产物将与 tag 源码不对应，已中止。如确需从该 tag 构建，请留空 checkout_ref。"
            exit 1
          fi
          echo "checkout_ref consistent with release_tag: $INPUT_RELEASE_TAG"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Create Release
        id: create
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'PurinBox ${{ env.RELEASE_TAG }}'
          draft: false
          prerelease: false
          generate_release_notes: true

  # 2. 构建 Windows
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD, 2026-03-27

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          $exePath = "src-tauri/target/release/PurinBox.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "PurinBox.exe not found at $exePath"
            exit 1
          }
          $zipDir = "portable-build"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          Copy-Item $exePath "$zipDir/PurinBox.exe"
          # 复制 resources（Python 脚本等）
          $resDir = "src-tauri/target/release/scripts"
          if (Test-Path $resDir) {
            Copy-Item -Recurse $resDir "$zipDir/scripts"
          }
          $zipName = "PurinBox_${version}_x64_portable.zip"
          Compress-Archive -Path "$zipDir/*" -DestinationPath $zipName -Force
          Write-Output "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV
          Write-Output "Portable ZIP created: $zipName"

      - name: Upload portable ZIP to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.PORTABLE_ZIP }}

  # 3. 构建 Linux x64 / ARM64 (deb + rpm + AppImage)
  build-linux:
    needs: create-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD, 2026-03-27

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles deb,rpm,appimage

  # 4. 构建 macOS (Apple Silicon + Intel)
  build-macos:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Rust
        run: |
          # Remove broken cargo shim if it points to rustup-init
          if cargo --version 2>&1 | grep -q "rustup-init"; then
            echo "cargo is a rustup-init shim, installing toolchain..."
            rustup-init -y --default-toolchain stable --target ${{ matrix.target }}
            source "$HOME/.cargo/env"
          else
            rustup default stable
            rustup target add ${{ matrix.target }}
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
