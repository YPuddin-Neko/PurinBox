name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. 先创建 GitHub Release（带更新日志）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'PurinBox ${{ github.ref_name }}'
          draft: false
          prerelease: false
          generate_release_notes: true

  # 2. 构建 Windows
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exePath = "src-tauri/target/release/PurinBox.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "PurinBox.exe not found at $exePath"
            exit 1
          }
          $zipDir = "portable-build"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          Copy-Item $exePath "$zipDir/PurinBox.exe"
          # 复制 resources（Python 脚本等）
          $resDir = "src-tauri/target/release/scripts"
          if (Test-Path $resDir) {
            Copy-Item -Recurse $resDir "$zipDir/scripts"
          }
          $zipName = "PurinBox_${version}_x64_portable.zip"
          Compress-Archive -Path "$zipDir/*" -DestinationPath $zipName -Force
          Write-Output "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV
          Write-Output "Portable ZIP created: $zipName"

      - name: Upload portable ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.PORTABLE_ZIP }}

  # 3. 构建 Linux (deb + rpm + AppImage)
  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x64

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles deb,rpm,appimage

  # 4. 构建 macOS (Apple Silicon + Intel)
  build-macos:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        run: |
          # Remove broken cargo shim if it points to rustup-init
          if cargo --version 2>&1 | grep -q "rustup-init"; then
            echo "cargo is a rustup-init shim, installing toolchain..."
            rustup-init -y --default-toolchain stable --target ${{ matrix.target }}
            source "$HOME/.cargo/env"
          else
            rustup default stable
            rustup target add ${{ matrix.target }}
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
