<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PurinBox - AI训练工具箱</title>
    <script>
      (function () {
        var m = localStorage.getItem('theme') || 'light';
        var r = m === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
        document.documentElement.setAttribute('data-theme', r);
      })();
    </script>
    <!-- Inter 字体已本地打包（src/assets/fonts）。不要恢复 Google Fonts 远程引用：
         阻塞式样式表在无代理的大陆网络会挂起 >20s，触发启动看门狗误杀导致应用起不来 -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
